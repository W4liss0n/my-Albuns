name: Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Headless checks and native pilot
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/rustup
            .tools/cargo/bin
            .tools/cargo/registry
            .tools/cargo/git
          key: windows-2022-rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Prepare pinned local Rust toolchain
        run: ./scripts/Setup-LocalToolchain.ps1 -SkipNodeInstall
      - name: Validate without visible windows
        run: npm run validate
      - name: Prepare native test build once
        run: npm run build:native-tests
      - name: Ensure WebView2 on the hosted runner
        run: |
          $runtimeRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          if (-not (Test-Path -LiteralPath $runtimeRoot)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -UseBasicParsing -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $installation = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($installation.ExitCode -ne 0) { throw 'WebView2 installation failed.' }
          }
      - name: Check Win32 process and window observation in isolation
        env:
          MYALBUNS_NATIVE_PROBE_TESTS: '1'
        run: node --test --test-concurrency=1 --test-name-pattern="HWND probe observes|exact.*window" scripts/Test-FocusedOwnedDialogGate.mjs scripts/Test-DevLifecycleProcessInstances.mjs
      - name: Run only the external-copy native scenario
        timeout-minutes: 8
        run: npm run test:native-owned-dialogs -- -Scenario external-copy-opening-owner -OutputPath .scratch/focused-owned-dialog-evidence/ci/report.json
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-windows-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .tools/validation/
            .tools/native-gate-build.json
            .scratch/focused-owned-dialog-evidence/ci/
