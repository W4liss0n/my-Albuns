[package]
name = "myalbuns-desktop"
version.workspace = true
description = "Editor desktop de diagramação de álbuns"
authors = ["MyAlbuns"]
edition.workspace = true
license.workspace = true

[lib]
name = "myalbuns_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
myalbuns-core = { path = "../crates/myalbuns-core" }
myalbuns-imaging-protocol = { path = "../crates/myalbuns-imaging-protocol" }
serde_json.workspace = true
