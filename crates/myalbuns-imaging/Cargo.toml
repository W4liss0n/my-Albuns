[package]
name = "myalbuns-imaging"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
embed-resource = "3"

[dependencies]
myalbuns-core = { path = "../myalbuns-core" }
myalbuns-imaging-protocol = { path = "../myalbuns-imaging-protocol" }
myalbuns-logging = { path = "../myalbuns-logging" }
myalbuns-paths = { path = "../myalbuns-paths" }
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
image = { workspace = true, features = ["jpeg", "png", "tiff"] }
fast_image_resize = "=5.5.0"
tiff.workspace = true
png = "=0.18.1"
flate2 = "=1.1.9"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
myalbuns-paths = { path = "../myalbuns-paths", features = ["test-support"] }
tempfile.workspace = true
