[workspace]
members = [
    "crates/myalbuns-core",
    "crates/myalbuns-imaging-protocol",
    "crates/myalbuns-imaging",
    "crates/myalbuns-logging",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
