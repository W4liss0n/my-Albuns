[workspace]
members = [
    "crates/myalbuns-paths",
    "crates/myalbuns-core",
    "crates/myalbuns-imaging-protocol",
    "crates/myalbuns-imaging",
    "crates/myalbuns-logging",
    "src-tauri",
]
resolver = "2"

# Upstream Windows input deadlock fix, compatible with Tauri's Tao 0.35 range.
# Remove when that range includes https://github.com/tauri-apps/tao/pull/1215.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "c704261c519c58cfdd0bc2d58ba24e06a0b71c92" }

# Optimize across crates while keeping the image worker's catch_unwind recovery.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Pixel loops and codecs must stay responsive in the local desktop build too.
# Include the Processor because generic image operations are instantiated there.
[profile.dev.package.myalbuns-imaging]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The reduced representation is resized by this crate's SIMD kernels.
[profile.dev.package.fast_image_resize]
opt-level = 3

# Keep the desktop's eye-correction pixel work responsive without optimizing the whole app at level 3.
[profile.dev.package.myalbuns-desktop]
opt-level = 1

# image 0.25 encodes the prepared full-resolution PNG through png 0.18.
[profile.dev.package."png:0.18.1"]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
directories = "6"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiff = "0.11.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Environment",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
