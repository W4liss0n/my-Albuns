<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><style>
html,body{margin:0;padding:0;height:100%;background:#f0eee9;overflow:hidden}
*{box-sizing:border-box}
a{color:oklch(0.52 0.13 250);text-decoration:none}
a:hover{color:oklch(0.44 0.14 250)}
input,select,button{font-family:inherit}
::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-thumb{background:#d0ccc2;border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b9b4a9;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
</style></helmet>

<div style="height:100vh;display:flex;flex-direction:column;background:#f0eee9;color:#2c2924;font-family:'Helvetica Neue',Helvetica,system-ui,sans-serif;font-size:13px;overflow:hidden;user-select:none">

  <div style="height:38px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:#fbfaf8;border-bottom:1px solid #e5e1d8">
    <div style="display:flex;gap:7px;align-items:center">
      <span style="width:10px;height:10px;border-radius:50%;background:#ddd8ce"></span>
      <span style="width:10px;height:10px;border-radius:50%;background:#ddd8ce"></span>
      <span style="width:10px;height:10px;border-radius:50%;background:#ddd8ce"></span>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:10px">
      <span style="font-weight:600;letter-spacing:.14em;font-size:10px;color:oklch(0.55 0.13 250);text-transform:uppercase">myalbuns</span>
    </div>
    <div style="font:400 11px ui-monospace,Menlo,monospace;color:#9b958a">{{ userLabel }}</div>
  </div>

  <div style="flex:1;display:flex;min-height:0">

    <div style="width:352px;flex:none;display:flex;flex-direction:column;background:#fbfaf8;border-right:1px solid #e5e1d8">
      <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:0 34px">
        <div style="font-size:30px;font-weight:600;letter-spacing:-.02em;color:#2c2924">myalbuns</div>
        <div style="margin-top:7px;font:400 11px ui-monospace,Menlo,monospace;color:#9b958a">diagramação de álbuns · versão 3.2.1</div>

        <div style="display:flex;flex-direction:column;gap:9px;margin-top:34px">
          <button type="button" onClick="{{ novoProjeto }}" style="display:flex;align-items:center;gap:11px;height:44px;padding:0 14px;border:0;background:oklch(0.55 0.13 250);color:#fff;font-size:13.5px;font-weight:500;text-align:left;cursor:default" style-hover="background:oklch(0.49 0.14 250)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3.2v9.6M3.2 8h9.6"></path></svg>
            <span style="flex:1">Novo projeto</span>
            <span style="font:400 10.5px ui-monospace,Menlo,monospace;opacity:.7">⌘N</span>
          </button>
          <button type="button" onClick="{{ abrirProjeto }}" style="display:flex;align-items:center;gap:11px;height:44px;padding:0 14px;border:1px solid #ddd8ce;background:#fff;color:#2c2924;font-size:13.5px;font-weight:500;text-align:left;cursor:default" style-hover="border-color:#c6c0b4;background:#fdfcfa">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.9 12.4V4.1a.8.8 0 0 1 .8-.8h3.4l1.5 1.7h5.7a.8.8 0 0 1 .8.8v6.6a.8.8 0 0 1-.8.8H2.7a.8.8 0 0 1-.8-.8Z"></path></svg>
            <span style="flex:1">Abrir projeto…</span>
            <span style="font:400 10.5px ui-monospace,Menlo,monospace;color:#a8a29a">⌘O</span>
          </button>
        </div>

        <div style="height:1px;background:#eae6de;margin:26px 0 0"></div>

        <div style="display:flex;flex-direction:column;gap:2px;margin-top:16px">
          <button type="button" style="display:flex;align-items:center;gap:9px;height:26px;padding:0;border:0;background:transparent;color:#6b665e;font-size:12.5px;text-align:left;cursor:default" style-hover="color:oklch(0.5 0.13 250)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 2.4v8M4.8 7.2 8 10.4l3.2-3.2M2.4 11.2v1.4a1 1 0 0 0 1 1h9.2a1 1 0 0 0 1-1v-1.4"></path></svg>
            <span>Exportar vários álbuns de uma vez</span>
          </button>
        </div>
      </div>

    </div>

    <div style="flex:1;min-width:0;display:flex;flex-direction:column;background:#f0eee9">

      <div style="flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
          <div style="margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:10px;padding:0 2px 8px">
              <span style="font:600 9.5px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#a29c92">{{ g.label }}</span>
              <span style="flex:1;height:1px;background:#e2ded4"></span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;align-items:start">
              <sc-for list="{{ g.items }}" as="p" hint-placeholder-count="6">
                <div data-id="{{ p.id }}" onClick="{{ selectProj }}" onDoubleClick="{{ openProj }}" style="display:flex;flex-direction:column;background:{{ p.bg }};border:1px solid {{ p.border }};border-radius:6px;overflow:hidden;cursor:default" style-hover="border-color:#cfc9bd">
                  <div style="position:relative;height:126px;flex:none;display:flex;align-items:center;justify-content:center;padding:12px;background:#e8e5de;border-bottom:1px solid #e9e5dc">
                    <div style="height:100%;aspect-ratio:{{ p.ratio }};background:{{ p.coverBg }};box-shadow:0 1px 6px rgba(60,54,44,.2);display:flex;flex-direction:column;justify-content:flex-end;padding:5px">
                      <span style="height:2px;width:62%;background:rgba(255,255,255,.72)"></span>
                    </div>
                    <button type="button" data-id="{{ p.id }}" onClick="{{ togglePin }}" title="Fixar no topo" style="position:absolute;top:4px;right:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;color:{{ p.pinColor }};cursor:default" style-hover="background:rgba(255,255,255,.75)">
                      <svg width="13" height="13" viewBox="0 0 16 16" fill="{{ p.pinFill }}" stroke="currentColor" stroke-width="1.3"><path d="m8 2.2 1.75 3.7 3.95.57-2.85 2.85.67 4.06L8 11.47l-3.52 1.91.67-4.06L2.3 6.47l3.95-.57Z"></path></svg>
                    </button>
                  </div>
                  <div style="flex:none;min-width:0;display:flex;flex-direction:column;gap:2px;padding:6px 8px">
                    <div title="{{ p.nome }}" style="font-size:11.5px;font-weight:600;color:#2c2924;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.nome }}</div>
                    <div style="font:400 10.5px ui-monospace,Menlo,monospace;color:#9b958a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.meta }}</div>
                    <div style="display:flex;align-items:center;gap:6px;padding-top:1px">
                      <span style="flex:1;min-width:0;font-size:10.5px;color:#8a847a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.quando }}</span>
                      <button type="button" data-id="{{ p.id }}" onClick="{{ openProj }}" title="Abrir" style="flex:none;width:17px;height:17px;display:flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;color:#a8a29a;cursor:default" style-hover="background:oklch(0.55 0.13 250);color:#fff">
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6.2 3.4 4.6 4.6-4.6 4.6"></path></svg>
                      </button>
                    </div>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>

        <sc-if value="{{ vazio }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:70px 0;color:#9b958a">
            <span style="font-size:13px">Nenhum projeto corresponde a “{{ q }}”.</span>
            <button type="button" onClick="{{ limpar }}" style="border:0;background:transparent;color:oklch(0.52 0.13 250);font-size:12.5px;cursor:default">Limpar busca</button>
          </div>
        </sc-if>
      </div>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { q: "", sort: "recente", sel: "p3", pins: { p1: true }, startup: true };

  projetos = [
    { id: "p1", nome: "Formatura Medicina 2026 — Turma B", formato: "30×30 cm", laminas: 6, fotos: 148, quando: "há 2 minutos", ord: 1, entrega: 20260902, pasta: "~/myalbuns/2026/medicina-turma-b", cover: "hatch", quad: true },
    { id: "p2", nome: "Casamento Marina & Téo", formato: "30×20 cm", laminas: 24, fotos: 612, quando: "ontem, 18:40", ord: 2, entrega: 20260828, pasta: "~/myalbuns/2026/marina-teo", cover: "#8d7f6d", quad: false },
    { id: "p3", nome: "Ensaio Helena — 6 meses", formato: "20×20 cm", laminas: 12, fotos: 96, quando: "ontem, 09:12", ord: 3, entrega: 20260819, pasta: "~/myalbuns/2026/helena-6meses", cover: "hatch", quad: true },
    { id: "p4", nome: "15 anos Beatriz", formato: "30×30 cm", laminas: 18, fotos: 340, quando: "sexta-feira", ord: 4, entrega: 20260915, pasta: "~/myalbuns/2026/beatriz-15", cover: "#6d7b83", quad: true },
    { id: "p5", nome: "Corporativo Vetra — relatório anual", formato: "21×29,7 cm", laminas: 32, fotos: 210, quando: "9 de agosto", ord: 5, entrega: 20261010, pasta: "~/myalbuns/clientes/vetra/2026", cover: "#7a6f77", quad: false },
    { id: "p6", nome: "Batizado Antônio", formato: "20×20 cm", laminas: 10, fotos: 84, quando: "2 de agosto", ord: 6, entrega: 20260812, pasta: "~/myalbuns/2026/antonio-batizado", cover: "hatch", quad: true },
    { id: "p7", nome: "Retrospectiva Estúdio 2025", formato: "30×20 cm", laminas: 40, fotos: 890, quando: "17 de julho", ord: 7, entrega: 20251218, pasta: "~/myalbuns/estudio/retrospectiva-2025", cover: "#8a8172", quad: false }
  ];

  setQ = (e) => this.setState({ q: e.target.value });
  setSort = (e) => this.setState({ sort: e.target.value });
  limpar = () => this.setState({ q: "" });
  selectProj = (e) => this.setState({ sel: e.currentTarget.dataset.id });
  openProj = (e) => { e.stopPropagation(); this.setState({ sel: e.currentTarget.dataset.id }); };
  togglePin = (e) => {
    e.stopPropagation();
    const id = e.currentTarget.dataset.id;
    this.setState(s => ({ pins: Object.assign({}, s.pins, { [id]: !s.pins[id] }) }));
  };
  toggleStartup = () => this.setState(s => ({ startup: !s.startup }));
  novoProjeto = () => this.setState({ sel: null });
  abrirProjeto = () => this.setState({ sel: null });

  renderVals() {
    const s = this.state, q = s.q.trim().toLowerCase();
    const hatch = "repeating-linear-gradient(45deg,#e6e1d7 0 5px,#dcd6ca 5px 10px)";

    let list = this.projetos.filter(p =>
      !q || (p.nome + " " + p.pasta).toLowerCase().includes(q));

    const cmp = {
      recente: (a, b) => a.ord - b.ord,
      nome: (a, b) => a.nome.localeCompare(b.nome, "pt-BR"),
      laminas: (a, b) => b.laminas - a.laminas,
      entrega: (a, b) => a.entrega - b.entrega
    }[s.sort];
    list = list.slice().sort(cmp);

    const shape = (p) => {
      const on = !!s.pins[p.id], selected = s.sel === p.id;
      return {
        id: p.id,
        nome: p.nome,
        pinned: on,
        meta: p.formato + " · " + p.laminas + " lâminas",
        quando: p.quando,
        pasta: p.pasta,
        coverBg: p.cover === "hatch" ? hatch : p.cover,
        ratio: p.quad ? "1 / 1" : "0.7 / 1",
        pinFill: on ? "oklch(0.62 0.14 65)" : "none",
        bg: selected ? "oklch(0.97 0.014 250)" : "#fbfaf8",
        border: selected ? "oklch(0.78 0.06 250)" : "#e5e1d8",
        pinColor: on ? "oklch(0.62 0.14 65)" : "#c2bcb1"
      };
    };

    const fixados = list.filter(p => s.pins[p.id]).map(shape);
    const resto = list.filter(p => !s.pins[p.id]).map(shape);
    const groups = [];
    if (fixados.length) groups.push({ label: "Fixados", items: fixados });
    if (resto.length) groups.push({ label: "Projetos recentes", items: resto });

    const selObj = this.projetos.find(p => p.id === s.sel);

    return {
      q: s.q, sort: s.sort, groups,
      vazio: list.length === 0,
      countLabel: list.length === this.projetos.length ? this.projetos.length + " projetos" : list.length + " de " + this.projetos.length,
      selecionado: selObj ? "selecionado: " + selObj.nome : "nenhum projeto selecionado",
      userLabel: "Estúdio Lumen · licença ativa",
      startupMark: s.startup ? "✓" : "",
      startupBg: s.startup ? "oklch(0.55 0.13 250)" : "#fff",
      startupBorder: s.startup ? "oklch(0.55 0.13 250)" : "#cfc9bd",
      setQ: this.setQ, setSort: this.setSort, limpar: this.limpar,
      selectProj: this.selectProj, openProj: this.openProj, togglePin: this.togglePin,
      toggleStartup: this.toggleStartup, novoProjeto: this.novoProjeto, abrirProjeto: this.abrirProjeto
    };
  }
}

</script>
</body>
</html>
